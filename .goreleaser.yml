# Terraform Registry release (HashiCorp provider scaffolding layout). Run by .github/workflows/release.yml on tag v*.
version: 2
before:
  hooks:
    - go mod tidy
builds:
  - id: provider
    env: [CGO_ENABLED=0]
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags: [-trimpath]
    ldflags: ['-s -w -X main.version={{.Version}} -X main.commit={{.Commit}}']
    goos: [freebsd, windows, linux, darwin]
    goarch: [amd64, '386', arm, arm64]
    ignore:
      - {goos: darwin, goarch: '386'}
    binary: '{{ .ProjectName }}_v{{ .Version }}'
archives:
  - id: provider
    ids: [provider]
    formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
checksum:
  ids: [provider]
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
signs:
  - artifacts: checksum
    args: ["--batch", "--local-user", "{{ .Env.GPG_FINGERPRINT }}", "--output", "${signature}", "--detach-sign", "${artifact}"]
release:
  # gyroctl is not packaged (build it with `go build ./cmd/gyroctl`): the Registry treats every *_<os>_<arch> asset as a
  # provider package. Do not set release.ids here: it also drops the SHA256SUMS.sig upload (v0.3.0 had to be fixed by hand).
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
changelog:
  disable: true
